<!DOCTYPE html>
<html>
<head>
  <title>CSS Flexbox</title>
  <style>
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      gap: 15px;
      min-height: 250px;
      background: #9b7f5e;
    }
    .item {
      flex: 1 1 150px;
      padding: 30px;
      text-align: center;
      background: #fdddbd;
      border: 1px solid #715e3e;
    }
  </style>
</head>
<body>
  <h1>Flexbox</h1>
  <div class="container">
    <div class="item">Flex Item 1</div>
    <div class="item">Flex Item 2</div>
    <div class="item">Flex Item 3</div>
  </div>
</body>
</html>
