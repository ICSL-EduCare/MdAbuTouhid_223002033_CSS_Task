<!DOCTYPE html>
<html>
<head>
  <title>Navigation, Dropdowns, Images and Forms</title>
  <style>
    nav {
      background: #222;
      padding: 12px;
    }
    nav a {
      color: rgb(250, 155, 72);
      text-decoration: none;
      margin-right: 20px;
    }

    .dropdown { display: inline-block; position: relative; }
    .dropdown-content {
      display: none;
      position: absolute;
      background: white;
      min-width: 140px;
      padding: 10px;
      box-shadow: 0 2px 8px #999;
    }
    .dropdown:hover .dropdown-content { display: block; }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 7px 0;
      box-sizing: border-box;
    }
    input:focus, textarea:focus { outline: 2px solid blue; }
    button { padding: 10px 18px; }
  </style>
</head>
<body>
  <nav>
    <a href="#">Home</a>
    <div class="dropdown">
      <a href="#">Products</a>
      <div class="dropdown-content">
        <a href="#">Item 1</a><br>
        <a href="#">Item 2</a>
      </div>
    </div>
  </nav>

  <h2>Responsive Image</h2>
  <img src="https://th.bing.com/th/id/OIP.ayS7_7qTj-iqRX0hYnGzeAHaEO?w=290&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Placeholder">

  <h2>Form</h2>
  <form>
    <input type="text" placeholder="Name">
    <input type="email" placeholder="Email">
    <select>
      <option>Select course</option><option>CSS</option></select>
    <textarea placeholder="Message"></textarea>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
