<!DOCTYPE html>
<html>
<head>
  <title>CSS Basics</title>
  <style>
    /* CSS syntax: selector { property: value; } */
    p { color: blue; font-size: 18px; }
    #special { color: red; }
    .note { background: lightgray; padding: 10px; }
  </style>
</head>
<body>
  <h1>CSS Basics</h1>
  <p>This paragraph uses an element selector.</p>
  <p id="special">This paragraph uses an ID selector.</p>
  <p class="note">This paragraph uses a class selector.</p>
</body>
</html>
