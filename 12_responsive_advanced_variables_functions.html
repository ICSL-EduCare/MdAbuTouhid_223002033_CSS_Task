<!DOCTYPE html>
<html>
<head>
  <title>Responsive and Advanced CSS</title>
  <style>
    :root {
      --main-color: #333;
      --space: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--main-color);
    }

    header {
      padding: var(--space);
      background: #eee;
      font-size: clamp(1.5rem, 4vw, 3rem);
    }

    .layout {
      width: min(1100px, 92%);
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--space);
    }

    .content, aside {
      padding: var(--space);
      border: 1px solid #aaa;
    }

    .responsive-box {
      width: calc(100% - 20px);
      max-width: 500px;
      padding: var(--space);
    }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
    }

    @media print {
      aside { display: none; }
    }
  </style>
</head>
<body>
  <header>Responsive CSS Website</header><br>

  <main class="layout">
    <section class="content">
      <h2>Advanced CSS</h2>
      <p>Uses CSS variables, calc(), min(), max(), clamp(), media queries and responsive layout.</p>
      <div class="responsive-box">Resize the browser window.</div>
    </section>
    <aside>Sidebar</aside>
  </main>
</body>
</html>
