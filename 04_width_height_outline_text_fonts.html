<!DOCTYPE html>
<html>
<head>
  <title>Size, Outline, Text and Fonts</title>
  <style>
    .sample {
      width: 70%;
      min-height: 150px;
      outline: 3px dashed gray;
      outline-offset: 5px;
      font-family: Arial, sans-serif;
      font-size: 20px;
      line-height: 1.6;
      text-align: center;
      text-decoration: none;
      text-transform: capitalize;
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px gray;
      margin: 30px auto;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="sample">Text, fonts, width, height and outline example</div>
</body>
</html>
