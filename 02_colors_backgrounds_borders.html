<!DOCTYPE html>
<html>
<head>
  <title>Colors, Backgrounds and Borders</title>
  <style>
    body { background-color: #f4f4f4; }
    h1 { color: rgb(20, 90, 160); }
    .box {
      background-color: white;
      background-image: linear-gradient(120deg, #fff, #dfefff);
      border: 3px solid #333;
      border-radius: 12px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Colors, Backgrounds and Borders</h1>
  <div class="box">A box with color, background and border properties.</div>
</body>
</html>
