<!DOCTYPE html>
<html>
<head>
  <title>Margin, Padding and Box Model</title>
  <style>
    .card {
      width: 300px;
      padding: 20px;
      border: 5px solid black;
      margin: 30px auto;
      box-sizing: border-box;
      background: #eee;
    }
    .card p { margin: 10px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Box Model</h2>
    <p>Content → Padding → Border → Margin</p>
  </div>
</body>
</html>
